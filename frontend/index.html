<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#efefea" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0d0c" media="(prefers-color-scheme: dark)" />
    <title>ভূমি সেবা — One parcel, one record</title>
    <meta
      name="description"
      content="A parcel-centric view of Bangladesh land records: ownership, নামজারি, ভূমি উন্নয়ন কর, maps and history under one Parcel ID."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Anek Latin + Anek Bangla: one superfamily (Ek Type), so the bilingual
         interface shares a skeleton across scripts. IBM Plex Mono for identifiers. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@300;400;500;600;700&family=Anek+Latin:wdth,wght@75..125,300;75..125,400;75..125,500;75..125,600;75..125,700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <script>
      // Resolve theme before first paint — no flash of the wrong sheet.
      (function () {
        try {
          var saved = localStorage.getItem('bhumi.theme');
          var sys = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var dark = saved ? saved === 'dark' : sys;
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
